<!doctype html>
<meta charset="utf-8"><title>Timers</title>
<script>
// Older links looked like /synced-timer/x08. Send them to the current style: /synced-timer/#/x08
var seg = location.pathname.split("/");
location.replace(location.origin + "/" + seg[1] + "/#/" + seg.slice(2).join("/"));
</script>

<!doctype html>
<meta charset="utf-8"><title>Timers</title>
<script>
// GitHub Pages shows this for any path that is not a real file. Send the visitor to the app with the path in ?p=.
var seg = location.pathname.split("/");
location.replace(location.origin + "/" + seg[1] + "/?p=" + encodeURIComponent(seg.slice(2).join("/")) + location.hash);
</script>

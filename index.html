<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Timers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600&display=swap">
<style>
  html { margin: 0; } body { margin: 0; }
  /* Layout: black and white only. One big countdown inside a thin frame, controls underneath.
     Orange is used only for the halfway and 1-minute flash, red only when time is up. */
  :root {
    --bg: #ffffff;
    --fg: #000000;
    --muted: #666666;
    --orange: #ff7a00;
    --red: #d40000;
    --green: #00ff2a;
    --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;

  :root { color-scheme: light; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }   /* stop phones from enlarging the digits */
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 16px; line-height: 1.4;
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main {
    max-width: none; margin: 0 auto; display: grid; grid-template-rows: 1fr auto 1fr;
    min-height: calc(100vh - 64px); min-height: calc(100dvh - 64px);
  }
  /* Zero-height row so the controls never push the timer off center; they hang below it. */
  .bottom { grid-row: 3; align-self: start; height: 0; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
  .bottom > * { position: relative; top: 56px; }
  /* Short screens (a phone on its side): the timer and its controls are centered together as one group instead. */
  body.compact main { grid-template-rows: 1fr auto auto 1fr; }
  body.compact .bottom { height: auto; margin-top: 28px; }
  body.compact .bottom > * { top: 0; }
  h1 { font-family: var(--font-time); font-weight: 600; font-size: 1.6rem; letter-spacing: .12em; text-transform: uppercase; margin: 0; }

  .display { grid-row: 2; position: relative; min-width: 0; padding: 24px 16px; text-align: center; }
  .time {
    font-family: var(--font-time); font-weight: 600; font-size: 20vw;   /* JS sets the exact size so the digits fill 80% of the page width */
    display: inline-block; white-space: nowrap;
    line-height: 1; font-variant-numeric: tabular-nums;
  }
  .status { position: absolute; left: 0; right: 0; top: 100%; font-size: 1rem; text-transform: uppercase; letter-spacing: .14em; opacity: .7; }

  /* orange flash at the halfway and 1-minute points */
  body.flash { animation: flashOrange .7s ease-in-out 3; }
  @keyframes flashOrange {
    0%, 100% { background: var(--bg); color: var(--fg); }
    50% { background: var(--orange); color: #000; }
  }
  /* the whole page flashes green when a timer starts (or resumes), on every device */
  body.go { animation: flashGreen .8s ease-in-out 1; }
  @keyframes flashGreen {
    0%, 100% { background: var(--bg); color: var(--fg); }
    50% { background: var(--green); color: #000; }

  /* red when time is up */
  body.done { --bg: var(--red); --fg: #ffffff; --muted: #ffd9d9; }
  body.done .status { opacity: 1; font-weight: 600; }
  .status:empty { display: none; }

  /* a small shake every time a sound plays */
  .shaker.shake { animation: shake .3s ease-in-out; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }

  /* notification sitting on the top edge of the timer */
  .banner {
    position: absolute; left: 50%; top: 0; transform: translate(-50%, -50%); z-index: 2;
    background: var(--orange); color: #000; border: 2px solid #000;
    padding: 8px 20px; border-radius: 12px; font-weight: 600; font-size: 1.2rem; text-transform: uppercase; letter-spacing: .08em;
    white-space: nowrap; max-width: 100%;
    animation: bannerIn .25s ease-out;
  }
  /* gray box in the same spot while a start/stop is being sent to the server */
  .syncing {

    background: #e6e6e6; color: #000; border: 2px solid #bdbdbd;
    padding: 8px 20px; border-radius: 12px; font-weight: 600; font-size: 1.2rem; text-transform: uppercase; letter-spacing: .08em;

    .shaker.shake { animation: none; }
    body.go { animation: none; background: var(--green); color: #000; }
    .banner { animation: none; }

  button {
    font: inherit; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; cursor: pointer;
    padding: 12px 22px; min-height: 48px; border: 2px solid var(--fg); border-radius: 14px;
    background: var(--fg); color: var(--bg);

  button:disabled { background: transparent; color: var(--muted); border-color: var(--muted); cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }

  .set { display: flex; gap: 16px; flex: 1 1 220px; min-width: 0; }
  .set label { display: flex; flex-direction: column; gap: 4px; font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; flex: 1; min-width: 0; }
  .set input, .set select {
    font: inherit; font-size: 1.4rem; color: var(--fg); background: transparent; border-radius: 0;
    border: 0; border-bottom: 2px solid var(--fg); padding: 6px 2px; min-height: 48px; width: 100%;
  }
  .set input:disabled, .set select:disabled { color: var(--muted); border-bottom-color: var(--muted); }
  .btns { display: flex; gap: 12px; flex: 1 1 200px; }
  .btns button { flex: 1; }
  /* homepage: search, create, list */
  .home { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .home input {
    font: inherit; font-size: 1.2rem; color: var(--fg); background: transparent; width: 100%; min-width: 0;
    padding: 12px 16px; min-height: 48px; border: 2px solid var(--fg); border-radius: 14px;
  }
  .create { display: flex; gap: 12px; }
  .msg { color: var(--muted); margin: 0; min-height: 1.4em; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #ddd; padding: 4px 0; }
  .list a.name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 600; font-size: 1.4rem; color: var(--fg); text-decoration: none; padding: 10px 0; }
  .list .tag { color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-size: .85rem; }
  .list button { min-height: 40px; padding: 6px 14px; font-size: .85rem; }
  .back { position: fixed; top: 10px; left: max(16px, env(safe-area-inset-left, 0px)); z-index: 5; color: var(--fg); opacity: .7;
          text-decoration: none; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; font-size: .9rem; padding: 8px 0; }
  .hint { max-width: 900px; margin: 0 auto; color: var(--muted); font-size: .95rem; margin: 0; }
</style>
</head>
<body>
<section class="home" id="home" hidden>
  <h1>Timers</h1>
  <input type="search" id="search" placeholder="Search timers" aria-label="Search timers" autocomplete="off">
  <form class="create" id="createForm">
    <input type="text" id="newName" placeholder="New timer name" aria-label="New timer name" maxlength="40" autocomplete="off">
    <button type="submit" id="createBtn">Create</button>
  </form>
  <p class="msg" id="msg" role="status"></p>
  <ul class="list" id="list"></ul>
  <p class="msg" id="empty" role="status"></p>
</section>

<a class="back" id="back" href="#/" hidden>&larr; Timers</a>
<main id="timerView" hidden>
  <section class="display" id="display" aria-label="Countdown">
    <div class="banner" id="banner" role="alert" hidden></div>
    <div class="syncing" id="syncing" role="status" hidden>Syncing</div>
    <div class="shaker" id="shaker">
      <div class="time" id="time">--:--</div>
      <div class="status" id="status" role="status">Connecting</div>
    </div>
  </section>

  <div class="bottom">
  <section class="controls" id="controls" hidden>
    <div class="set" id="setBox">
      <label>Minutes<input type="number" id="min" min="0" max="180" step="1" value="5" inputmode="numeric"></label>
      <label>Seconds<select id="sec"><option>0</option><option>15</option><option>30</option><option>45</option></select></label>
    </div>
    <div class="btns">
      <button type="button" id="pause" class="outline" hidden>Pause</button>
      <button type="button" id="go">Start</button>
    </div>
  </section>

  <p class="hint" id="hint"></p>
  </div>
</main>

    if (Math.abs(d - fs) / d > 0.01) timeEl.style.fontSize = d + "px";
  }
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", function () { setTimeout(fit, 200); });
  window.addEventListener("load", fit);
  if (document.fonts) {
    if (document.fonts.ready) document.fonts.ready.then(fit);
    if (document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", fit);
  }
  if (window.ResizeObserver) new ResizeObserver(fitIfNeeded).observe(displayEl);
  function render() {
    if (!curKey) return;
    if (timeEl.textContent.length !== fitLen) fit(); else fitIfNeeded();
    if (!state) {
      document.body.classList.remove("done");
      timeEl.textContent = "--:--";
      if (connected) statusEl.textContent = "Timer not found";   // deleted, or a wrong link
      else statusEl.textContent = errMsg || "Searching for timers";   // still asking Firebase
      setHint(); updateControls();
      return;
    }
    var rem = remaining(state), done = isDone(state), active = activeRun(state), paused = isPaused(state), hold = holding(state);
    timeEl.textContent = fmt(rem);
    if (timeEl.textContent.length !== fitLen) fit();
    document.body.classList.toggle("done", done);
    if (done) {
      document.body.classList.remove("flash");
      if (!doneShown) { doneShown = true; showBanner("Time is up", true); }   // shown once, then it goes away; the page stays red
    } else if (doneShown) { bannerEl.hidden = true; doneShown = false; }
    statusEl.textContent = paused ? "Paused" : "";

    goBtn.textContent = hold ? "Stop" : (done ? "Start again" : "Start");
    pauseBtn.textContent = paused ? "Resume" : "Pause";
    goBtn.disabled = pending > 0 || (hold && !mine(state));   // also off while a change is being sent
    pauseBtn.disabled = pending > 0;
    minEl.disabled = secEl.disabled = hold;
    setHint(); updateControls();

    // Green flash when a timer starts or resumes. It shows on every device, so everyone knows it really started.
    if (state.running && pending === 0 && state.updatedAt && state.updatedAt !== flashedFor) {
      flashedFor = state.updatedAt;
      if (now() - state.updatedAt < 4000) greenFlash();
    }

    if (active) cues(state, rem);
    if (done) {
      if (alarmedFor !== state.endAt) {
        alarmedFor = state.endAt;
        if (now() - state.endAt < 8000) startAlarm();
      }
    } else { stopAlarm(); }
    if (!active && !done) { document.body.classList.remove("flash"); bannerEl.hidden = true; }
    if (!state.running) document.body.classList.remove("go");

    if (state.durationMs !== syncedDuration && document.activeElement !== minEl && document.activeElement !== secEl) {
      syncedDuration = state.durationMs;
      var total = Math.round(state.durationMs / 1000);
      minEl.value = Math.floor(total / 60);
      var s = total % 60; secEl.value = String([0, 15, 30, 45].indexOf(s) >= 0 ? s : 0);
    }
  }
  setInterval(render, 250);


  /* ---- changing the shared timer (one write at a time) ---- */
  // The screen updates at once. The gray "Syncing" box shows only if the server takes longer than a moment to confirm.
  function beginSync() {
    pending++; render();
    if (pending === 1) {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(function () {
        if (pending > 0) { clearTimeout(syncMsgTimer); syncEl.textContent = "Syncing"; syncEl.hidden = false; }
      }, 200);
    }
  }
  function endSync() {
    pending = Math.max(0, pending - 1); render();
    if (pending === 0) { clearTimeout(syncTimer); syncEl.hidden = true; }
  }
  function syncFailed() {
    syncEl.textContent = "Couldn't sync";
    syncEl.hidden = false;
    clearTimeout(syncMsgTimer);
    syncMsgTimer = setTimeout(function () { if (pending === 0) syncEl.hidden = true; }, 4000);
  }
  function save(next) {
    var g = gen;
    beginSync();           // first, so the screen does not treat the unconfirmed start as a finished one
    state = next; render();
    set(timerRef, next).then(function () {
      if (g !== gen) return;                      // the person already left this timer
      if (next.running) { flashedFor = next.updatedAt; greenFlash(); }   // the server confirmed the start
      endSync();
    }).catch(function (e) {
      if (g !== gen) return;
      endSync(); syncFailed();
      console.error("Timer write refused:", e && e.code, e && e.message);   // the live listener puts the real state back
    });
  }
  // Every write carries the same fields. updatedAt is server time; runId stays the same through pause and resume.
  function timerDoc(o) {
    return { name: state.name, createdBy: state.createdBy, createdAt: state.createdAt, durationMs: o.durationMs, endAt: o.endAt || 0, running: !!o.running, paused: !!o.paused,
             remainingMs: o.remainingMs, owner: o.owner || "", runId: o.runId || 0, updatedAt: now() };
  }
  function duration() {
    var m = Math.max(0, Math.min(180, parseInt(minEl.value, 10) || 0));
    return (m * 60 + parseInt(secEl.value, 10)) * 1000;
  }
  function onSetting() {
    clearTimeout(debounce);
    debounce = setTimeout(function () {
      if (!state || holding(state)) return;
      var d = duration(); syncedDuration = d;
      save(timerDoc({ durationMs: d, remainingMs: d }));
    }, 400);
  }
  minEl.addEventListener("input", onSetting);
  secEl.addEventListener("change", onSetting);

  goBtn.addEventListener("click", function () {
    if (!timerRef || !myId || pending > 0 || !state) return;
    clearTimeout(debounce);
    if (holding(state)) {
      if (!mine(state)) return;                       // only the person who started it can stop it
      save(timerDoc({ durationMs: state.durationMs, remainingMs: state.durationMs }));
    } else {
      var d = duration(); if (d <= 0) return;
      syncedDuration = d;
      save(timerDoc({ durationMs: d, endAt: now() + d, running: true, remainingMs: d, owner: myId, runId: now() }));
    }
  });

  pauseBtn.addEventListener("click", function () {
    if (!timerRef || !myId || pending > 0 || !holding(state) || !mine(state)) return;
    if (isPaused(state)) {
      save(timerDoc({ durationMs: state.durationMs, endAt: now() + state.remainingMs, running: true,
                      remainingMs: state.remainingMs, owner: myId, runId: state.runId }));
    } else {
      save(timerDoc({ durationMs: state.durationMs, remainingMs: Math.max(0, state.endAt - now()), paused: true,
                      owner: myId, runId: state.runId }));
    }
  });

  /* ---- homepage: list, search, create, delete ---- */
  var NAME_RE = /^[A-Za-z0-9]+([ -][A-Za-z0-9]+)*$/;
  function say(t) { msgEl.textContent = t || ""; }
  function validTimer(d) { return !!(d && typeof d.durationMs === "number" && typeof d.name === "string"); }
  function renderHome() {
    if (curKey) return;
    var q = searchEl.value.trim().toLowerCase();
    var rows = Object.keys(timers || {}).filter(function (k) {
      return validTimer(timers[k]) && timers[k].name.toLowerCase().indexOf(q) >= 0;
    }).sort(function (a, b) { return timers[a].name.toLowerCase() < timers[b].name.toLowerCase() ? -1 : 1; })
      .map(function (k) {
        var t = timers[k];
        return { k: k, name: t.name, tag: activeRun(t) ? "Running" : (isPaused(t) ? "Paused" : ""), del: !!(myId && t.createdBy === myId) };
      });
    emptyEl.textContent = timers === null ? (errMsg || "Searching for timers") : (rows.length ? "" : (q ? "No timers match" : "No timers yet"));
    createBtn.disabled = !ready || !myId || creating;
    var sig = JSON.stringify(rows);
    if (sig === lastSig) return;                  // only rebuild when something changed, so clicks are never lost
    lastSig = sig;
    listEl.textContent = "";
    rows.forEach(function (r) {
      var li = document.createElement("li"), a = document.createElement("a");
      a.className = "name"; a.href = "#/t/" + r.k; a.textContent = r.name; li.appendChild(a);
      if (r.tag) { var tg = document.createElement("span"); tg.className = "tag"; tg.textContent = r.tag; li.appendChild(tg); }
      if (r.del) {
        var b = document.createElement("button"); b.type = "button"; b.className = "outline"; b.textContent = "Delete";
        b.addEventListener("click", function () {
          if (!window.confirm("Delete \"" + r.name + "\"? This can't be undone.")) return;
          remove(ref(db, "timers/" + r.k)).then(function () { say(""); }).catch(function () { say("Couldn't delete it."); });
        });
        li.appendChild(b);
      }
      listEl.appendChild(li);
    });
  }
  setInterval(renderHome, 1000);
  searchEl.addEventListener("input", renderHome);
  createForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = nameEl.value.replace(/\s+/g, " ").trim();
    if (!name) return;
    if (name.length > 40 || !NAME_RE.test(name)) { say("Use up to 40 letters, numbers, spaces or dashes."); return; }
    var key = name.toLowerCase().replace(/ /g, "-");     // "Math Quiz" and "math-quiz" count as the same name
    if (timers && timers[key]) { say("That name is taken."); return; }
    if (!db || !myId) return;
    creating = true; say(""); renderHome();
    var d = 300000;
    set(ref(db, "timers/" + key), { name: name, createdBy: myId, createdAt: now(), durationMs: d, endAt: 0, running: false,
                                    paused: false, remainingMs: d, owner: "", runId: 0, updatedAt: now() })
      .then(function () { nameEl.value = ""; say(""); })
      .catch(function () { say("Couldn't create it. The name may be taken."); })
      .then(function () { creating = false; renderHome(); });
  });

  /* ---- which page is showing ---- */
  function resetTimerView() {
    gen++;
    state = null; connected = false; flashedFor = 0; cued = {}; alarmedFor = 0; doneShown = false; syncedDuration = -1;
    pending = 0; clearTimeout(syncTimer); clearTimeout(syncMsgTimer); clearTimeout(bannerTimer); clearTimeout(flashTimer); clearTimeout(goTimer);
    clearTimeout(debounce);
    syncEl.hidden = true; bannerEl.hidden = true;
    ["done", "flash", "go", "compact"].forEach(function (c) { document.body.classList.remove(c); });
    timeEl.textContent = "--:--"; statusEl.textContent = ""; fitLen = -1;
  }
  function route() {
    var m = /^#\/t\/([a-z0-9-]+)$/.exec(location.hash);
    if (m) {
      if (curKey === m[1]) return;
      resetTimerView();
      curKey = m[1];
      timerRef = db ? ref(db, "timers/" + curKey) : null;
      connected = timers !== null;
      state = connected && validTimer(timers[curKey]) ? timers[curKey] : null;
      homeEl.hidden = true; viewEl.hidden = false; backEl.hidden = false;
      render(); fit();
    } else {
      resetTimerView();
      curKey = null; timerRef = null; lastSig = null;
      viewEl.hidden = true; backEl.hidden = true; homeEl.hidden = false;
      renderHome();
    }
  }
  window.addEventListener("hashchange", route);

  /* ---- connect to Firebase ---- */
  var slow = setTimeout(function () {
    if (timers === null) { errMsg = "Can't reach the timers yet"; render(); renderHome(); }
  }, 10000);

  try {
    var app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    onValue(ref(db, ".info/serverTimeOffset"), function (snap) { offset = snap.val() || 0; });
    onValue(ref(db, "timers"), function (snap) {
      timers = snap.val() || {}; connected = true; errMsg = ""; clearTimeout(slow);
      if (curKey) {
        var d = timers[curKey];
        state = validTimer(d) ? d : null;
        timerRef = ref(db, "timers/" + curKey);
        render();
      } else renderHome();
    }, function () {
      clearTimeout(slow); errMsg = "Can't reach the timers"; render(); renderHome();
    });
    // Anonymous sign-in gives each browser a private ID (no login). It is how "only the starter can stop it" and
    // "only the creator can delete it" are enforced.
    var auth = getAuth(app);
    signInAnonymously(auth).then(function () {
      myId = auth.currentUser.uid; canWrite = true; ready = true; render(); renderHome();
    }).catch(function () {
      canWrite = false; ready = true; render(); renderHome();
    });
  } catch (e) {
    clearTimeout(slow); errMsg = "Can't reach the timers"; render(); renderHome();
  }
  route();
})();
</script>
</body>
</html>
